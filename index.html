<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<title>이오북스 마케팅 허브</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--lime:#b9d232;--lime-d:#7f9413;--sky:#8fb1dd;--sky-d:#3f6fb0;--ink:#1f2937;--sub:#6b7280;--line:#e5e7eb;--bg:#f6f7f9;--card:#fff;--warn:#fff4c2;--bad:#fde2e2;--good:#e3f2d3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Pretendard,"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
a{color:var(--sky-d)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px}
.top img{height:26px}
.top b{font-size:16px}
.top .who{margin-left:auto;font-size:13px;color:var(--sub)}
nav{display:flex;gap:2px;padding:0 14px;overflow-x:auto;white-space:nowrap}
nav a{padding:9px 12px;text-decoration:none;color:var(--sub);border-bottom:3px solid transparent;font-weight:500}
nav a.on{color:var(--ink);border-color:var(--lime)}
main{max-width:1180px;margin:0 auto;padding:20px}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 10px}
.guide{background:#fffbe6;border:1px solid #f0e2a0;border-radius:8px;padding:9px 14px;margin:10px 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>.card{flex:1;min-width:300px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-left:5px solid var(--sky);border-radius:10px;padding:12px 14px;cursor:pointer}
.kpi.hot{border-left-color:#e06666}
.kpi b{display:block;font-size:26px;line-height:1.2}
.kpi span{font-size:13px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--sub);border-bottom:2px solid var(--line);padding:7px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover{background:#fafbfc}
td small{display:block;color:var(--sub);margin-top:2px}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap;background:#eef0f3;color:#4b5563}
.b-good{background:var(--good);color:#3d6b12}.b-warn{background:var(--warn);color:#7a5b00}.b-bad{background:var(--bad);color:#a12626}.b-wait{background:#e7eefb;color:#2c5aa0}.b-fb{background:#ece3fa;color:#5b3aa0}
.hist{border-left:3px solid var(--line);margin:8px 0 0 4px;padding-left:12px;font-size:14px}.hist div{margin-bottom:8px}.hist b{font-weight:600}
.over{color:#a12626;font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .sp{margin-left:auto}
select,input,textarea{font:inherit;border:1px solid #cfd4dc;border-radius:7px;padding:6px 9px;background:#fff;color:var(--ink);max-width:100%}
textarea{width:100%;resize:vertical}
button{font:inherit;border:1px solid #cfd4dc;background:#fff;border-radius:7px;padding:6px 13px;cursor:pointer;font-weight:500}
button.pri{background:var(--ink);border-color:var(--ink);color:#fff}
button.ai{background:var(--lime);border-color:var(--lime-d);color:#26300a}
button:disabled{opacity:.45;cursor:not-allowed}
.studio{display:grid;grid-template-columns:300px 1fr;gap:16px}
.list{max-height:78vh;overflow:auto}
.item{padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.item.on{background:#f3f8dc}
.item small{color:var(--sub);display:block}
.step{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.step h3{margin:0 0 8px;font-size:15px}
.step h3 i{font-style:normal;display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:var(--sky);color:#fff;font-size:13px;margin-right:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;font-size:13px;color:var(--sub)}
.fld>*{font-size:15px;color:var(--ink)}
.muted{color:var(--sub);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:20;overflow:auto}
.modal>div{background:#fff;border-radius:12px;padding:20px;width:min(640px,100%)}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;z-index:30;font-weight:600}
.login{max-width:380px;margin:12vh auto;text-align:center}
.err{color:#a12626;font-size:14px;margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:4px 12px;border-radius:99px;border:1px solid #cfd4dc;background:#fff;cursor:pointer;font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.demo{background:#fde2e2;color:#a12626;text-align:center;font-size:13px;padding:4px}
pre.msg{white-space:pre-wrap;font:inherit;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:12px;margin:0}
@media(max-width:820px){.studio{grid-template-columns:1fr}.list{max-height:240px}.grid2{grid-template-columns:1fr}main{padding:12px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== 설정: 배포 안내에 따라 두 값을 채웁니다 ===== */
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbzi0ElZqcdOl86p9OQ2IxkSJspb0MGwcEwMZVDQTcYIvsIvDhqyCfmSRp4wlzl4ERjG/exec',      // 앱스 스크립트 웹앱 주소 (…/exec)
  CLIENT_ID: '691949344595-s1hq543e7l69qjfnjb7d4uq71pr01625.apps.googleusercontent.com'     // 구글 OAuth 클라이언트 ID (….apps.googleusercontent.com)
};
const MOCK = !CONFIG.GAS_URL || /[?&]demo=1/.test(location.search);

/* ===== 공통 ===== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = { user: null, d: {}, view: 'home', f: { tasks: { 영역: '', 담당조직: '', 상태: '' }, skill: '공통', req: { who: 'mine', st: '' } }, people: [], img: {}, sel: '', cmp: false, busy: '', err: '', modal: null };
const ST = { 과업: ['예정', '진행 중', '대기', '지연', '완료', '보류'], 요청: ['요청', '진행', '피드백', '완료', '보류'], 콘텐츠: ['예정', '작성 중', '검수 요청', '수정 요청', '승인', '발행 완료'] };
const TYPES = ['도서 소개', '정보형', '이용 안내', '이오북스 이야기'];
const SKILL_TYPES = ['공통', ...TYPES, '점검', '이미지', '데일리 뉴스'];
const ROLE_EDIT = { 과업: ['admin', 'eo', 'sf'], 요청: ['admin', 'eo', 'sf', 'sales'], 회의: ['admin', 'eo', 'sf'], 문서: ['admin', 'eo', 'sf'], 콘텐츠: ['admin', 'eo', 'sf'], 뉴스: ['admin', 'eo', 'sf'], 도서: ['admin', 'eo'], 스킬: ['admin', 'eo'], 뉴스소스: ['admin', 'eo'] };
const ROLE_NAME = { admin: '관리자', eo: '이오북스 담당', sf: '세일즈핏', sales: '영업', viewer: '열람' };
const KEY = { 사용자: '이메일' };
const can = t => !!S.user && (ROLE_EDIT[t] || []).includes(S.user.role);
const approver = () => !!S.user && ['admin', 'eo'].includes(S.user.role);
const NAV = [['home', '홈'], ['requests', '업무 요청'], ['tasks', '과업'], ['meetings', '회의록'], ['calendar', '콘텐츠 캘린더'], ['studio', '블로그 스튜디오'], ['news', '데일리 뉴스'], ['leads', '견본 신청'], ['docs', '문서'], ['skills', '콘텐츠 스킬']];
const FORM = {
  과업: [['영역', 'select', ['기반', '콘텐츠', '광고', '견본·리드', '제휴', '영업', '운영']], ['과업', 'text'], ['내용', 'area'], ['담당조직', 'select', ['이오북스', '세일즈핏', '공동']], ['담당자', 'text'], ['마감', 'text'], ['상태', 'select', ST.과업], ['근거', 'text']],
  요청: [['제목', 'text'], ['담당자', 'select', () => S.people.map(p => p.이름)], ['기한', 'date'], ['우선순위', 'select', ['보통', '긴급', '높음', '낮음']], ['내용', 'area'], ['관련문서', 'text']],
  회의: [['일시', 'text'], ['제목', 'text'], ['참석', 'text'], ['요약', 'area'], ['결정사항', 'area'], ['링크', 'text']],
  문서: [['위치', 'text'], ['문서명', 'text'], ['링크', 'text'], ['작성', 'text'], ['요약', 'area'], ['열람상태', 'text']],
  뉴스소스: [['이름', 'text'], ['방식', 'select', ['구글뉴스', 'RSS']], ['값', 'text'], ['사용', 'select', ['Y', 'N']]],
  도서: [['도서명', 'text'], ['대상', 'text'], ['저자', 'text'], ['핵심메시지', 'area'], ['독자고민', 'area'], ['차별점', 'area'], ['구성', 'area'], ['대표사례', 'area'], ['구매링크', 'area'], ['주의사항', 'area']],
  스킬: [['유형', 'select', SKILL_TYPES], ['항목', 'text'], ['내용', 'area']],
  콘텐츠: [['채널', 'select', ['블로그', '카페', '인스타그램', '스레드']], ['유형', 'select', TYPES], ['독자', 'select', ['학생', '교사', '학생·학부모', '공통']], ['제목', 'text'], ['키워드', 'area'], ['예정일', 'text']]
};
function badge(s) {
  const c = ['완료', '발행 완료', '승인', '통과'].includes(s) ? 'b-good' : ['진행 중', '진행', '작성 중', '검수 요청', '승인 대기', '높음'].includes(s) ? 'b-warn' : ['지연', '수정 요청', '보완', '긴급'].includes(s) ? 'b-bad' : ['대기', '요청'].includes(s) ? 'b-wait' : s === '피드백' ? 'b-fb' : '';
  return `<span class="badge ${c}">${esc(s || '-')}</span>`;
}
const opts = (list, cur) => { const l = list.includes(cur) || !cur ? list : [cur, ...list]; return l.map(o => `<option${o === cur ? ' selected' : ''}>${esc(o)}</option>`).join(''); };
function merge(tab, row) {
  const k = KEY[tab] || 'ID', a = S.d[tab] || (S.d[tab] = []), i = a.findIndex(x => x[k] === row[k]);
  if (i < 0) a.push(row); else a[i] = Object.assign({}, a[i], row);
  return row;
}

/* ===== 서버 통신 ===== */
async function api(action, data, busy) {
  if (busy) { S.busy = busy; render(); }
  try {
    if (MOCK) return await mock(action, data);
    const r = await fetch(CONFIG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: sessionStorage.getItem('tok'), action, data }) });
    const j = await r.json();
    if (!j.ok) {
      if (j.error === 'AUTH') { sessionStorage.removeItem('tok'); S.user = null; S.err = '로그인이 만료되었습니다. 다시 로그인해 주세요.'; }
      throw new Error(j.error);
    }
    return j.data;
  } finally { if (busy) S.busy = ''; }
}
async function run(fn) { try { await fn(); } catch (e) { if (e.message !== 'AUTH') alert(e.message); } render(); }
async function load() {
  try { const r = await api('init', {}, '불러오는 중입니다'); S.user = r.user; S.d = r.tabs; S.people = r.people || []; S.err = ''; }
  catch (e) { S.user = null; if (e.message !== 'AUTH') S.err = e.message; }
  render();
}
async function save(tab, row) { return merge(tab, await api('save', { tab, row })); }
function initLogin() {
  if (S.user || MOCK) return;
  if (!window.google || !google.accounts) return setTimeout(initLogin, 200);
  google.accounts.id.initialize({ client_id: CONFIG.CLIENT_ID, callback: r => { sessionStorage.setItem('tok', r.credential); load(); } });
  const el = $('#gbtn'); if (el) google.accounts.id.renderButton(el, { theme: 'outline', size: 'large', text: 'signin_with', locale: 'ko' });
}

/* ===== 화면 ===== */
function render() {
  const app = $('#app');
  if (!S.user) {
    app.innerHTML = `<div class="login card"><img src="logo.png" alt="(주)이오북스" style="height:34px"><h1 style="margin-top:14px">마케팅 허브</h1><p class="muted">이오북스와 세일즈핏의 협업 현황, 콘텐츠 제작을 한곳에서 관리합니다.</p><div id="gbtn" style="display:flex;justify-content:center;margin-top:18px"></div>${S.err ? `<div class="err">${esc(S.err)}</div>` : ''}</div>${S.busy ? `<div class="busy">${esc(S.busy)}</div>` : ''}`;
    return initLogin();
  }
  const V = { home: vHome, tasks: vTasks, requests: vRequests, meetings: vMeetings, calendar: vCalendar, studio: vStudio, news: vNews, leads: vLeads, docs: vDocs, skills: vSkills };
  app.innerHTML = `${MOCK ? '<div class="demo">미리보기 모드입니다. 예시 데이터로 동작하며 저장되지 않습니다.</div>' : ''}
<header><div class="top"><img src="logo.png" alt="(주)이오북스"><b>마케팅 허브</b><span class="who">${esc(S.user.name)} · ${esc(ROLE_NAME[S.user.role] || S.user.role)} <button data-act="reload">새로 고침</button></span></div>
<nav>${NAV.map(([k, n]) => `<a href="#${k}" class="${S.view === k ? 'on' : ''}">${n}</a>`).join('')}</nav></header>
<main>${(V[S.view] || vHome)()}</main>${S.modal ? vModal() : ''}${S.busy ? `<div class="busy">${esc(S.busy)}</div>` : ''}`;
}
const guide = t => `<div class="guide">${t}</div>`;

const today = () => new Date(Date.now() + 9 * 36e5).toISOString().slice(0, 10);
function due(x) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(x.기한 || '')) return { t: esc(x.기한 || '-'), late: false };
  const d = Math.round((Date.parse(x.기한) - Date.parse(today())) / 864e5), open = !['완료', '보류'].includes(x.상태);
  const tag = !open ? '' : d < 0 ? `${-d}일 지남` : d === 0 ? '오늘' : `D-${d}`;
  return { t: `${x.기한.slice(5).replace('-', '/')}${tag ? ` <span class="${d < 0 ? 'over' : 'muted'}">${tag}</span>` : ''}`, late: open && d < 0 };
}
const mine = x => (x.담당자 === S.user.name && ['요청', '진행'].includes(x.상태)) || (x.요청자 === S.user.name && x.상태 === '피드백');
const reqRow = x => `<tr class="click" data-act="rq-open" data-id="${x.ID}"><td>${esc(x.제목)}<small>${esc(x.요청자)} → ${esc(x.담당자)} · ${due(x).t}</small></td><td>${badge(x.상태)}</td></tr>`;
function vHome() {
  const t = S.d.과업, r = S.d.요청, c = S.d.콘텐츠, n = S.d.뉴스;
  const stuck = t.filter(x => ['지연', '대기'].includes(x.상태)), todo = r.filter(mine), late = r.filter(x => due(x).late);
  const k = [
    ['내가 처리할 업무 요청', todo.length, 'requests', 'mine', 1], ['기한이 지난 업무 요청', late.length, 'requests', 'late', 1],
    ['늦어지거나 멈춘 과업', stuck.length, 'tasks', '지연·대기', 1], ['검수를 기다리는 글', c.filter(x => x.상태 === '검수 요청').length, 'studio', '', 0],
    ['승인을 기다리는 뉴스', n.filter(x => x.상태 === '승인 대기').length, 'news', '', 0]];
  const soon = c.filter(x => !['발행 완료'].includes(x.상태)).slice(0, 6);
  const mt = [...S.d.회의].sort((a, b) => b.일시.localeCompare(a.일시)).slice(0, 4);
  return `<h1>이번 주 협업 현황</h1>${guide('숫자를 누르면 해당 목록으로 이동합니다. 화요일 정기 미팅은 이 화면을 보며 진행합니다.')}
<div class="kpis">${k.map(x => `<div class="kpi ${x[4] && x[1] ? 'hot' : ''}" data-act="go" data-v="${x[2]}" data-st="${x[3]}"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>
<div class="row"><div class="card"><h2>내가 처리할 업무 요청</h2><table>${todo.slice(0, 8).map(reqRow).join('') || '<tr><td class="muted">없습니다</td></tr>'}</table></div>
<div class="card"><h2>기한이 지난 업무 요청</h2><table>${late.slice(0, 8).map(reqRow).join('') || '<tr><td class="muted">없습니다</td></tr>'}</table></div></div>
<div class="row"><div class="card"><h2>회의록</h2><table>${mt.map(x => `<tr><td style="width:120px">${esc(x.일시)}</td><td>${esc(x.제목)}<small>${esc(x.결정사항 || x.요약)}</small></td><td style="width:70px">${x.링크 ? `<a href="${esc(x.링크)}" target="_blank" rel="noopener">열기</a>` : ''}</td></tr>`).join('')}</table></div>
<div class="card"><h2>늦어지거나 멈춘 과업</h2><table>${stuck.slice(0, 6).map(x => `<tr class="click" data-act="edit" data-tab="과업" data-id="${x.ID}"><td>${esc(x.과업)}<small>${esc(x.담당자)} · ${esc(x.마감)}</small></td><td>${badge(x.상태)}</td></tr>`).join('') || '<tr><td class="muted">없습니다</td></tr>'}</table></div></div>
<div class="card"><h2>다가오는 콘텐츠</h2><table>${soon.map(x => `<tr class="click" data-act="open" data-id="${x.ID}"><td style="width:90px">${esc(x.예정일)}</td><td style="width:80px">${esc(x.채널)}</td><td>${esc(x.제목 || x.키워드)}</td><td>${badge(x.상태)}</td></tr>`).join('')}</table></div>`;
}

function vTasks() {
  const f = S.f.tasks, all = S.d.과업;
  const rows = all.filter(x => (!f.영역 || x.영역 === f.영역) && (!f.담당조직 || x.담당조직 === f.담당조직) && (!f.상태 || (f.상태 === '지연·대기' ? ['지연', '대기'].includes(x.상태) : x.상태 === f.상태)));
  const sel = (k, list) => `<select data-f="${k}"><option value="">${k} 전체</option>${list.map(o => `<option${f[k] === o ? ' selected' : ''}>${o}</option>`).join('')}</select>`;
  const ed = can('과업');

    return { row: { ID: data.id, 상태: data.to }, hist: [h(data.id, data.to, data.note)] };
  }
  if (action === 'image') return { row: { ID: data.id }, data: 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200"><rect width="320" height="200" fill="#eef4d0"/><text x="160" y="105" text-anchor="middle" font-size="16">미리보기 이미지</text></svg>') };
  if (action === 'ai') {
    const o = { ID: data.id };
    if (data.kind === 'outline') { o.구성안 = '(미리보기) 제목 후보 3개\n1. …\n\n문단별 구성\n1) 독자의 고민 …'; o.상태 = '작성 중'; }
    if (data.kind === 'body') o.본문 = '(미리보기) 실제 연결 후에는 콘텐츠 스킬과 도서 정보를 바탕으로 본문이 작성됩니다.';
    if (data.kind === 'check') o.점검결과 = JSON.stringify([{ 항목: '도입부', 결과: '통과', 근거: '독자의 상황으로 시작', 제안: '' }, { 항목: '마무리', 결과: '보완', 근거: '구매 링크 없음', 제안: '링크 추가' }]);
    return o;
  }
  if (action === 'news') return { ID: 'NW-' + String(Date.now()).slice(-4), 날짜: new Date().toISOString().slice(0, 10), 후보: JSON.stringify([{ 제목: '(미리보기) 예시 소식', 출처: '예시', 링크: '#', 한줄: '요약 한 줄', 팁: '교실 팁' }]), 문안: '(미리보기) 오늘의 AI·교육 소식\n\n1. 예시 소식 …', 상태: '승인 대기', 승인자: '' };
}

/* ===== 시작 ===== */
S.view = NAV.some(n => n[0] === location.hash.slice(1)) ? location.hash.slice(1) : 'home';
if (MOCK || sessionStorage.getItem('tok')) load(); else render();
</script>
